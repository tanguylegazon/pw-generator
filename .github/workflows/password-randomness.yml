name: Password randomness tests

on:
  push:
    branches:
      - main
    paths:
      - password.js
      - script.js
      - exclusions.js
      - theme.js
      - index.html
      - style.css
      - 'tests/**/*.cjs'
      - .github/workflows/password-randomness.yml
  pull_request:
    paths:
      - password.js
      - script.js
      - exclusions.js
      - theme.js
      - index.html
      - style.css
      - 'tests/**/*.cjs'
      - .github/workflows/password-randomness.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: randomness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  randomness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          check-latest: true
          package-manager-cache: false

      - name: Test generator and interactions
        run: node --test tests/*.test.cjs
